services:
  - type: web
    name: proofloop
    runtime: docker
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PROOFLOOP_DATA_DIR
        value: /var/data
      - key: PROOFLOOP_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: PROOFLOOP_RATE_LIMIT_MAX
        value: "60"
    disk:
      name: proofloop-data
      mountPath: /var/data
      sizeGB: 1

name: ProofLoop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js && node --check data.js && node --check server.js && node --check lib/decision.js && node --check lib/workspaces.js && node --check lib/research.js && node --check lib/extraction.js
